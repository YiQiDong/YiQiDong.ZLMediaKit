[api]
apiDebug=0
secret=035c73f7-bb6b-4889-a715-d9eb2d1925cc
snapRoot=./www/snap/
defaultSnap=./www/logo.png

[ffmpeg]
bin=/usr/bin/ffmpeg
cmd=%s -re -i %s -c:a aac -strict -2 -ar 44100 -ab 48k -c:v libx264 -f flv %s
snap=%s -i %s -y -f mjpeg -t 0.001 %s
log=./ffmpeg/ffmpeg.log
restart_sec=0

[general]
enableVhost=0
flowThreshold=1024
maxStreamWaitMS=15000
streamNoneReaderDelayMS=20000
addMuteAudio=1
resetWhenRePlay=1
publishToHls=0
publishToMP4=0
mergeWriteMS=0
modifyStamp=0
mediaServerId=your_server_id
enable_audio=1
hls_demand=0
rtsp_demand=0
rtmp_demand=0
ts_demand=0
fmp4_demand=0

wait_track_ready_ms=10000
wait_add_track_ms=3000
unready_frame_cache=100
continue_push_ms=15000

[hls]
fileBufSize=65536
filePath=./www
segDur=2
segNum=3
segRetain=5
broadcastRecordTs=0
deleteDelaySec=0
segKeep=0

[hook]
admin_params=secret=501238b16c10488983005f076a61cef7
enable=1
on_flow_report=http://127.0.0.1/api/zlhook/on_flow_report
on_http_access=http://127.0.0.1/api/zlhook/on_http_access
on_play=http://127.0.0.1/api/zlhook/on_play
on_publish=http://127.0.0.1/api/zlhook/on_publish
on_record_mp4=http://127.0.0.1/api/zlhook/on_record_mp4
on_record_ts=http://127.0.0.1/api/zlhook/on_record_ts
on_rtsp_auth=http://127.0.0.1/api/zlhook/on_rtsp_auth
on_rtsp_realm=http://127.0.0.1/api/zlhook/on_rtsp_realm
on_shell_login=http://127.0.0.1/api/zlhook/on_shell_login
on_stream_changed=http://127.0.0.1/api/zlhook/on_stream_changed
on_stream_none_reader=http://127.0.0.1/api/zlhook/on_stream_none_reader
on_stream_not_found=http://127.0.0.1/api/zlhook/on_stream_not_found
on_server_started=http://127.0.0.1/api/zlhook/on_server_started
on_server_keepalive=http://127.0.0.1/api/zlhook/on_server_keepalive
timeoutSec=10
alive_interval=10.0
retry=1
retry_delay=3.0

[cluster]
origin_url=
timeout_sec=15
retry_count=3

[http]
charSet=utf-8
keepAliveSecond=30
maxReqSize=40960
port=8180
rootPath=./www
sendBufSize=65536
sslport=0
dirMenu=1
virtualPath=
forbidCacheSuffix=
forwarded_ip_header=

[multicast]
addrMax=239.255.255.255
addrMin=239.0.0.0
udpTTL=64

[record]
appName=record
fileBufSize=65536
filePath=./www
fileSecond=3600
sampleMS=500
fastStart=0
fileRepeat=0
mp4_as_player=0

[rtmp]
handshakeSecond=15
keepAliveSecond=15
modifyStamp=0
port=0
sslport=0

[rtp]
audioMtuSize=600
videoMtuSize=1400
rtpMaxSize=10

[rtp_proxy]
dumpDir=
port=10000
timeoutSec=15
port_range=30000-35000
h264_pt=98
h265_pt=99
ps_pt=96
ts_pt=33
opus_pt=100
g711u_pt=0
g711a_pt=8


[rtc]
timeoutSec=15
externIP=
port=8000
rembBitRate=0
preferredCodecA=PCMU,PCMA,opus,mpeg4-generic
preferredCodecV=H264,H265,AV1X,VP9,VP8

[srt]
timeoutSec=5
port=9000
latencyMul=4
pktBufSize=8192

[rtsp]
authBasic=0
directProxy=1
handshakeSecond=15
keepAliveSecond=15
port=554
sslport=0

[shell]
maxReqSize=1024
port=0
